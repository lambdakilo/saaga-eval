[project]
name = "saaga-eval"
version = "0.1.0"
description = "Does AI-generated repository documentation help coding agents? A 2x2 evaluation of saaga on AGENTbench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
